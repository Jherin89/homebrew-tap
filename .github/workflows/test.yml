name: brew test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: ${{ matrix.formula }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-latest]
        formula: [daypeek, tidy]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        run: |
          if ! brew tap | grep -qx 'jherin89/tap'; then
            brew tap jherin89/tap "$GITHUB_WORKSPACE"
          fi
          brew tap-info jherin89/tap
      - name: Style and audit
        run: |
          brew style jherin89/tap/${{ matrix.formula }}
          brew audit --strict jherin89/tap/${{ matrix.formula }}
      - name: Install
        run: brew install jherin89/tap/${{ matrix.formula }}
      - name: Test
        run: |
          brew test jherin89/tap/${{ matrix.formula }}
          "$(brew --prefix)/bin/${{ matrix.formula }}" --version
          file "$(brew --prefix)/bin/${{ matrix.formula }}"
